<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Web application for foosball referee"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foosball Referee</title>
  <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/modern-normalize@0.6.0/modern-normalize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
  <link type="image/x-icon" href="/foosball-referee/assets/icon-lGsDMFdE.png" rel="icon">
  <script type="module" crossorigin src="/foosball-referee/assets/index-B5VV837r.js"></script>
  <link rel="stylesheet" crossorigin href="/foosball-referee/assets/index-DpK1JFkp.css">
</head>

<body>
  <div id="app" v-bind:class="themeName">
    <div class="wrapper">
      <div class="main">
        <div class="title">
          <div class="title-text">Foosball Referee</div>
          <div class="title-options">
            <select v-model="themeSelected" @change="selectTheme($event)">
              <option v-for="theme in themes" v-bind:value="theme.value">
              {{ theme.name }}
              </option>
            </select>
            <button class="btn-reset" @click="handleReset()">Reset</button>
          </div>
        </div>

        <div class="scoreboard">
          <team-panel
            name="Team 1"
            :team-id="1"
            :team="team1"
            @click-button="handleButton"
          ></team-panel>
          <team-panel
            name="Team 2"
            :team-id="2"
            :team="team2"
            @click-button="handleButton"
          ></team-panel>
        </div>

        <div class="timer" id="timer">
          <div class="countdown-timer" v-bind:class="[countdownWarning ? 'countdown-warning': (countdownState == 'running' ? 'countdown-running': '')]" @click="handlePauseTimer()">
            {{ countdownDisplay }}
          </div>
          <div class="countdown-low-timer">
            <div class="countdown-btn">
              <button class="btn-10s" @click="handleSetTimer(10)">10s</button>
            </div>
            <div class="countdown-btn">
              <button class="btn-15s" @click="handleSetTimer(15)">15s</button>
            </div>
          </div>
          <div class="countdown-high-timer">
            <div class="countdown-btn">
              <button class="btn-3s" @click="handleSetTimer(3)">3s</button>
            </div>
            <div class="countdown-btn">
              <button class="btn-5s" @click="handleSetTimer(5)">5s</button>
            </div>
          </div>
        </div>

        <div class="about">
          Copyright &copy; David Zhang, 2024.
          <a href="https://github.com/crispgm/foosball-referee" target="_blank">Open sourced on GitHub</a>.
        </div>
      </div>
    </div>
  </div>
</body>


</html>

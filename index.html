<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Web application for foosball referee"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foosball Referee</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/modern-normalize@0.6.0/modern-normalize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
  <link type="image/x-icon" href="/foosball-referee/assets/icon.png" rel="icon">
  <script type="module" crossorigin src="/foosball-referee/assets/index.js"></script>
  <link rel="stylesheet" crossorigin href="/foosball-referee/assets/index.css">
</head>

<body>
  <div id="app" v-bind:class="themeName">
    <div class="wrapper">
      <main class="main">
        <header class="title">
          <h1 class="title-text">Foosball Referee</h1>
          <label class="theme-label">
            <span class="visually-hidden">Theme</span>
            <select v-model="themeSelected" @change="selectTheme($event)">
              <option v-for="theme in themes" v-bind:value="theme.value">
                {{ theme.name }}
              </option>
            </select>
          </label>
        </header>

        <section class="timer" id="timer" aria-labelledby="timer-title">
          <div class="section-heading">
            <h2 id="timer-title">Timer</h2>
            <span class="timer-status" aria-live="polite">{{ timerStatus }}</span>
          </div>
          <button class="countdown-timer" v-bind:class="[countdownWarning ? 'countdown-warning': (countdownState == 'running' ? 'countdown-running': '')]" :disabled="countdownState === 'ready' || countdownState === 'stop'" :aria-label="timerHint + ', ' + countdownDisplay + ' seconds remaining'" @click="handlePauseTimer()">
            {{ countdownDisplay }}
          </button>
          <p class="timer-hint">{{ timerHint }}</p>
          <div class="timer-presets" role="group" aria-label="Start countdown">
            <button @click="handleSetTimer(15)">15 s</button>
            <button @click="handleSetTimer(10)">10 s</button>
            <button @click="handleSetTimer(5)">5 s</button>
            <button @click="handleSetTimer(3)">3 s</button>
          </div>
        </section>

        <section class="scoreboard-section" aria-labelledby="record-title">
          <div class="section-heading">
            <h2 id="record-title">Match record</h2>
            <button class="btn-reset" @click="handleResetMatch()">Reset match</button>
          </div>
          <div class="scoreboard">
            <team-panel
              name="Team 1"
              :team-id="1"
              :team="team1"
              @click-button="handleButton"
            ></team-panel>
            <team-panel
              name="Team 2"
              :team-id="2"
              :team="team2"
              @click-button="handleButton"
            ></team-panel>
          </div>
        </section>

        <footer class="about">
          <p>Copyright &copy; David Zhang, 2026.</p>
          <nav aria-label="Footer links">
            <a href="https://github.com/crispgm/foosball-referee" target="_blank" rel="noopener noreferrer">Source</a>
            <span aria-hidden="true">&middot;</span>
            <a href="https://tablesoccer.org/rules/" target="_blank" rel="noopener noreferrer">Rules</a>
          </nav>
        </footer>
      </main>
    </div>
  </div>
</body>


</html>
